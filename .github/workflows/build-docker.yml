name: Build and publish image to Docker
on: 
    push:
        branches:
            - Main

jobs:
    publish_image:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: checkout
              uses: actions/checkout@v4
            #- name: Build image
            #  run: docker build ./Docker/ -t haagensenk/whktest:latest
            #- name: push image to docker
            #  run: |
            #    docker login -u haagensenk -p ${{ secrets.DOCKER_HUB }}
            #    docker push haagensenk/whktest:latest

            - name: log in to GTCJR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Set lowercase owner
              run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

            - name: build docker image
              run: docker build -t ghcr.io/$OWNER_LC/whktest:latest ./DockerK8S

            - name: run docker image
              run: docker run ghcr.io/$OWNER_LC/whktest:latest

            - name: push docker image
              run: docker push ghcr.io/$OWNER_LC/whktest:latest