apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bananaCounter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/WHKWork/ServerAuto.git
    targetRevision: Main
    path: DockerK8S
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true